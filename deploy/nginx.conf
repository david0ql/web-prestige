# Respeta el esquema original si hay un proxy TLS delante (Caddy); si no, el de esta conexión.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 320m;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://api:3300;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # index.html nunca en caché: tras un despliegue el navegador carga la versión nueva.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
